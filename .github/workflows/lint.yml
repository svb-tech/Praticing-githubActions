#goal of this file will that linter will check if the sysntax,fformat
# ,indentation (linking) is correct or not


name: Auto Lint

on:
  push:
    paths: ["*.js"]

jobs:
    code:
        runs-on: ubuntu-latest  #gives the ephimeral containter
        steps:
            - name: checkout/clone the code
              uses: actions/checkout@v4  # it is a github action which automatically clone the code into the ephimeral container
              
            - name : Setup node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run the lint
              run: npm run lint
           